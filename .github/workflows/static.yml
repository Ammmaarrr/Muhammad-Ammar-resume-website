name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Build static SPA
        env:
          # IMPORTANT: replace with your repo name (with leading + trailing slash)
          # if hosting on GitHub Pages under https://<user>.github.io/<repo>/
          BASE_PATH: /Muhammad-Ammar-resume-website/
        run: |
          npm run build:static
          mv dist-static/index.static.html dist-static/index.html
          cp dist-static/index.html dist-static/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-static
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
